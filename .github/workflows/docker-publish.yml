name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 双 registry 发布：GHCR（海外用户）+ Docker Hub（国内经 docker.1ms.run 等代理拉取）。
# Docker Hub 推送需要仓库 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Access Token）。
# Secrets 未配置时自动跳过 Docker Hub 部分，仅推 GHCR（不阻塞发布）。
# 注意：Docker Hub 用户名默认取 secrets.DOCKERHUB_USERNAME（缺省 bg8cfb），
#       compose 里镜像路径写死了 bg8cfb，若用户名不同需同步修改部署文件。
jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: docker/Dockerfile.backend
            platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - image: backend
            dockerfile: docker/Dockerfile.backend
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
          - image: frontend
            dockerfile: docker/Dockerfile.frontend
            platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - image: frontend
            dockerfile: docker/Dockerfile.frontend
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve lowercase image names
        id: ref
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          # Docker Hub 用户名：优先取 secrets，缺省与 GitHub 一致
          DH_USER="${DH_USERNAME:-$OWNER_LC}"
          if [ "${{ matrix.image }}" = "backend" ]; then
            echo "name=ghcr.io/${OWNER_LC}/tradingagents-backend" >> "$GITHUB_OUTPUT"
            echo "dh_name=docker.io/${DH_USER}/tradingagents-backend" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${OWNER_LC}/tradingagents-frontend" >> "$GITHUB_OUTPUT"
            echo "dh_name=docker.io/${DH_USER}/tradingagents-frontend" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by-digest (GHCR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=${{ steps.ref.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.slug }}

      # 同一构建产物推 Docker Hub：GHA 缓存全命中，仅消耗推送时间
      - name: Build and push by-digest (Docker Hub)
        id: build_dh
        if: ${{ env.DH_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=${{ steps.ref.outputs.dh_name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.slug }}
          # 缓存已由上一步写入，这里不重复写
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.slug }}

      # digest 由镜像内容决定，两个 registry 必须一致；不一致说明构建不可复现，直接失败
      - name: Verify digest consistency across registries
        if: ${{ env.DH_TOKEN != '' }}
        run: |
          if [ "${{ steps.build.outputs.digest }}" != "${{ steps.build_dh.outputs.digest }}" ]; then
            echo "::error::Digest mismatch: GHCR=${{ steps.build.outputs.digest }} DH=${{ steps.build_dh.outputs.digest }}"
            exit 1
          fi
          echo "Digest consistent: ${{ steps.build.outputs.digest }}"

      - name: Export digest artifact
        run: |
          mkdir -p ./digests
          echo "${{ steps.build.outputs.digest }}" > "./digests/${{ matrix.image }}-${{ matrix.slug }}.txt"
          cat "./digests/${{ matrix.image }}-${{ matrix.slug }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.slug }}
          path: ./digests/${{ matrix.image }}-${{ matrix.slug }}.txt
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }} manifest
    needs: build
    runs-on: ubuntu-latest
    env:
      DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - name: Resolve lowercase image name
        id: ref
        run: |
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          DH_USER="${DH_USERNAME:-$OWNER_LC}"
          if [ "${{ matrix.image }}" = "backend" ]; then
            echo "name=ghcr.io/${OWNER_LC}/tradingagents-backend" >> "$GITHUB_OUTPUT"
            echo "dh_name=docker.io/${DH_USER}/tradingagents-backend" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${OWNER_LC}/tradingagents-frontend" >> "$GITHUB_OUTPUT"
            echo "dh_name=docker.io/${DH_USER}/tradingagents-frontend" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DH_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download all digests for ${{ matrix.image }}
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ./digests
          merge-multiple: true

      - name: Assemble manifest sources
        id: sources
        run: |
          set -e
          MANIFEST_SOURCES=""
          while IFS= read -r f; do
            d=$(tr -d '[:space:]' < "$f")
            MANIFEST_SOURCES="$MANIFEST_SOURCES ${{ steps.ref.outputs.name }}@$d"
          done < <(ls ./digests/*.txt)
          echo "sources=$MANIFEST_SOURCES" >> "$GITHUB_OUTPUT"
          echo "Manifest sources:$MANIFEST_SOURCES"

      # Docker Hub 的 manifest sources：同一份 digest，仅仓库名不同
      - name: Assemble Docker Hub manifest sources
        if: ${{ env.DH_TOKEN != '' }}
        id: dh_sources
        run: |
          set -e
          DH_SOURCES=""
          while IFS= read -r f; do
            d=$(tr -d '[:space:]' < "$f")
            DH_SOURCES="$DH_SOURCES ${{ steps.ref.outputs.dh_name }}@$d"
          done < <(ls ./digests/*.txt)
          echo "sources=$DH_SOURCES" >> "$GITHUB_OUTPUT"
          echo "Docker Hub manifest sources:$DH_SOURCES"

      - name: Resolve tag
        id: tag
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create multi-arch manifest (GHCR)
        run: |
          set -e
          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tag.outputs.tags }}"
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $t"
          done
          echo "Creating manifest with tags: $TAG_ARGS"
          echo "Sources:${{ steps.sources.outputs.sources }}"
          docker buildx imagetools create $TAG_ARGS ${{ steps.sources.outputs.sources }}

      # tag 集合与 GHCR 保持一致：tag push 事件打版本号 + latest，其余（workflow_dispatch）仅 latest
      - name: Create multi-arch manifest (Docker Hub)
        if: ${{ env.DH_TOKEN != '' }}
        run: |
          set -e
          DH_REPO="${{ steps.ref.outputs.dh_name }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            DH_TAGS="${DH_REPO}:${VER},${DH_REPO}:latest"
          else
            DH_TAGS="${DH_REPO}:latest"
          fi
          TAG_ARGS=""
          IFS=',' read -ra TAG_LIST <<< "$DH_TAGS"
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS="$TAG_ARGS -t $t"
          done
          echo "Creating Docker Hub manifest with tags: $TAG_ARGS"
          echo "Sources:${{ steps.dh_sources.outputs.sources }}"
          docker buildx imagetools create $TAG_ARGS ${{ steps.dh_sources.outputs.sources }}

      - name: Inspect final image
        run: |
          for t in $(echo '${{ steps.tag.outputs.tags }}' | tr ',' ' '); do
            echo "=== $t ==="
            docker buildx imagetools inspect "$t" || true
          done
          if [ -n "${{ env.DH_TOKEN }}" ]; then
            echo "=== ${{ steps.ref.outputs.dh_name }}:latest ==="
            docker buildx imagetools inspect "${{ steps.ref.outputs.dh_name }}:latest" || true
          fi
