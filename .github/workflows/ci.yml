name: Test

# 触发策略（节省 Actions 配额）：
# - 普通 push 到 main/develop 不触发测试，本地用 scripts/run_full_tests.sh 预检
# - pull_request 仍触发，保证 PR 质量
# - workflow_dispatch 支持在 Actions 页面手动触发
# - 打 tag 前请先本地跑 scripts/run_full_tests.sh，通过后再 tag 触发 Docker Publish
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# 同一分支连续推送时取消仍在进行的旧运行，节省 Actions 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯单元测试：无 services 容器，DB 相关测试通过 SimulatedMongoDB/
  # SimulatedRedis 或自动 skip 降级，追求最快反馈
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGODB_HOST: localhost
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: tradingagents123
      MONGODB_DATABASE: tradingagents_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # 修复 protobuf 与 google-generativeai 等包的版本兼容性
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        id: install_python
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: |
          pip install uv
          uv --version

      - name: Install dependencies
        run: |
          # 显式传入 setup-python 提供的 3.12 解释器，避免 uv venv 选到系统 Python 3.10
          # （Python 3.10 的 datetime.fromisoformat 不支持 "Z" 后缀，导致 Freshness 测试失败）
          uv venv --python "${{ steps.install_python.outputs.python-path }}"
          . .venv/bin/activate
          python --version
          uv pip install -e .
          uv pip install pytest pytest-asyncio pytest-timeout hypothesis httpx

      - name: Run unit tests
        run: |
          . .venv/bin/activate
          pytest tests/ -m "not integration and not slow and not ai" \
            --tb=short --durations=20 --timeout=120

  # 集成测试：带真实 MongoDB/Redis services 容器，
  # 只跑 integration 层，与 unit 并行互不拖累
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: tradingagents123
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' -u admin -p tradingagents123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_HOST: localhost
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: tradingagents123
      MONGODB_DATABASE: tradingagents_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # 修复 protobuf 与 google-generativeai 等包的版本兼容性
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        id: install_python
        with:
          python-version: '3.12'
          cache: pip

      - name: Install uv
        run: |
          pip install uv
          uv --version

      - name: Install dependencies
        run: |
          uv venv --python "${{ steps.install_python.outputs.python-path }}"
          . .venv/bin/activate
          python --version
          uv pip install -e .
          uv pip install pytest pytest-asyncio pytest-timeout hypothesis httpx

      - name: Run integration tests
        run: |
          . .venv/bin/activate
          pytest tests/ -m "integration and not ai" \
            --tb=short --durations=20 --timeout=180
