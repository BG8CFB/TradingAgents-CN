# A 股调度时间表 (CST = Asia/Shanghai)
# cron 格式: "分 时 日 月 周"

trade_calendar:
  cron: "0 0 * * *"
  timezone: "Asia/Shanghai"
  mode: full
  description: "每日 00:00 全量同步交易日历"

basic_info:
  cron: "0 9 * * *"
  timezone: "Asia/Shanghai"
  mode: full
  description: "每日 09:00 全量同步股票列表"
  depends_on:
    - trade_calendar

daily_quotes:
  cron: "15 16 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 16:15 增量同步日线行情"
  depends_on:
    - basic_info

daily_indicators:
  cron: "45 16 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 16:45 增量同步每日指标"
  depends_on:
    - daily_quotes

adj_factors:
  cron: "0 17 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 17:00 增量同步复权因子"
  depends_on:
    - daily_quotes

financial_data:
  cron: "0 20 * * *"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每日 20:00 按报告期批量同步财务数据（最近 5 期全市场，重拉覆盖迟披露）"

money_flow:
  cron: "30 16 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 16:30 按日批量同步资金流向（拉最近 6 个交易日，窗口自愈）"
  depends_on:
    - daily_quotes

factor_scores:
  cron: "15 20 * * 1-5"
  timezone: "Asia/Shanghai"
  description: "每交易日 20:15 全市场 L0 因子批算（读库计算，无外部同步）"
  depends_on:
    - financial_data
    - daily_indicators
    - money_flow

market_quotes:
  cron: "5 15 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: full
  description: "每交易日 15:05 全量市场快照"

news:
  cron: "0 */2 * * *"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每 2 小时增量同步新闻"

# ── 补排（上游 schedule.yaml 原本漏了这 3 个域，导致它们永不自动同步）──
dragon_tiger:
  cron: "50 20 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 20:50 增量同步龙虎榜（官方 20:00 发布）"
  depends_on:
    - basic_info

block_trade:
  cron: "10 21 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 21:10 增量同步大宗交易（官方 21:00 发布）"
  depends_on:
    - basic_info

margin_trading:
  cron: "10 9 * * 1-5"
  timezone: "Asia/Shanghai"
  mode: incremental
  description: "每交易日 09:10 增量同步融资融券（官方 9:00 发布，隔一交易日披露）"
  depends_on:
    - basic_info
