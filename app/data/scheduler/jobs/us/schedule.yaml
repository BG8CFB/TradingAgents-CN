# 美股调度时间表 (ET = America/New_York，含夏令时)
# 调度引擎自动按 DST 规则换算到服务器时区
# cron 格式: "分 时 日 月 周"

trade_calendar:
  cron: "0 0 * * *"
  timezone: "America/New_York"
  mode: full
  description: "每日 00:00 ET 全量同步交易日历"
  source: "tushare_us"

basic_info:
  cron: "0 6 * * *"
  timezone: "America/New_York"
  mode: full
  description: "每日 06:00 ET 全量同步股票列表"
  source: "finnhub"
  depends_on:
    - trade_calendar

tushare_universe:
  cron: "30 6 * * 1"
  timezone: "America/New_York"
  mode: full
  description: "每周一 06:30 ET 维护 Tushare 覆盖白名单"
  source: "tushare_us"

corporate_actions:
  cron: "0 18 * * *"
  timezone: "America/New_York"
  mode: incremental
  description: "每日 18:00 ET 增量同步公司行为"
  source: "yfinance"

daily_quotes:
  cron: "30 16 * * 1-5"
  timezone: "America/New_York"
  mode: incremental
  description: "每交易日 16:30 ET 增量同步日线行情"
  depends_on:
    - basic_info

daily_indicators:
  cron: "30 17 * * 1-5"
  timezone: "America/New_York"
  mode: incremental
  description: "每交易日 17:30 ET 增量同步每日指标"
  depends_on:
    - daily_quotes

# adj_factors 已于 2026-11-01 摘除：增量语义下拉不到数据（source_health 显示
# 每交易日空转 ~8.8 分钟、0 条入库）。批量化改造（按 trade_date 全市场）优先
# 落在 CN（tushare adj_factor）；US 无可用批量上游。未来 US 源支持按日批量
# （或推导链路落地）后恢复本条目（Job 类 USAdjFactorsJob 仍保留在 registry）。

financial_data:
  cron: "0 21 * * *"
  timezone: "America/New_York"
  mode: incremental
  description: "每日 21:00 ET 增量同步财务数据"

market_quotes:
  cron: "1 16 * * 1-5"
  timezone: "America/New_York"
  mode: full
  description: "每交易日 16:01 ET 全量收盘快照"
  source: "yfinance"

# pre_post_market 已于 2026-11-01 摘除：finnhub 免费层无盘前盘后数据，
# 且 fallback_router method_map 无该域映射，每 5 分钟恒失败（source_health
# 0 成功、熔断 open、集合 0 条）。未来上游（finnhub 付费层或其他源）支持
# 盘前盘后行情并接入 method_map 后恢复（Job 类 USPrePostMarketJob 仍保留）。

news:
  cron: "0 */1 * * *"
  timezone: "America/New_York"
  mode: incremental
  description: "每 1 小时增量同步新闻"
  source: "finnhub"
