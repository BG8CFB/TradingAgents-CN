# 各数据源限流参数
# retry 块（可选）：max_retries 最大重试次数 / backoff_base 退避倍率；
# 缺省时 FallbackRouter 使用全局默认（max_retries=2, backoff_base=1.0）

tushare:
  rate_per_minute: 200
  polite_interval_ms: 300
  circuit_initial_cooldown: 60
  circuit_max_cooldown: 600
  requires_token: true
  token_env_var: TUSHARE_CN_TOKEN
  retry:
    max_retries: 2
    backoff_base: 1.0

tushare_hk:
  rate_per_minute: 200
  polite_interval_ms: 300
  circuit_initial_cooldown: 60
  circuit_max_cooldown: 600
  requires_token: true
