# 架构约束的执行位置（2026-08 重构，单一事实源见 AGENTS.md）：
# - 禁止 import config_manager        -> ruff TID251（pyproject.toml banned-api）
# - 禁止 routers import 数据层内部实现  -> import-linter forbidden 契约（pyproject.toml）
# - 禁止 routers 直连 MongoDB 方法调用  -> tests/lint/test_router_conventions.py（pytest，跨平台）
# - os.getenv 白名单                  -> tests/lint/test_env_access_conventions.py（pytest，跨平台）
#
# 旧版 bash grep 钩子已移除：误报/漏报（文本匹配无法区分对象归属）、
# Windows 宿主机无 bash 时直接失效、白名单三处硬编码已发生漂移。
repos:
  # Python linting + 架构禁令（banned-api）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 分层/关系型架构契约（基于真实 import 解析）
  - repo: local
    hooks:
      - id: import-linter
        name: Architecture contracts (import-linter)
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
